<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#050816">
  <title>SPACE JOURNEY</title>
  <link rel="stylesheet" href="./style.css?v=8">
  <script type="importmap">
    { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js" } }
  </script>
</head>
<body>
  <main id="game">
    <div id="hud">
      <div class="brand"><span class="brand-mark">✦</span><div><strong>SPACE JOURNEY</strong><small>BUILD 08 · EARTH & MOON</small></div></div>
      <div class="stats">
        <div class="stat"><small>DISTANCE</small><b id="distance">0000 m</b></div>
        <div class="stat"><small>COINS</small><b id="coins">0</b></div>
      </div>
      <button id="pause" class="icon-button" aria-label="Pause">Ⅱ</button>
    </div>
    <div id="message">
      <span class="eyebrow">MISSION 01 · MARS FRONTIER</span>
      <h1>THE JOURNEY<br><em>BEGINS</em></h1>
      <p>Steer through the cosmic highway. Collect energy and avoid the rocks.</p>
      <button id="start" class="primary-button">START RIDE <span>➜</span></button>
    </div>
    <div id="countdown" aria-live="polite"></div>
    <div id="toast"></div>
    <div id="controls">
      <div class="steer-hint">DRAG LEFT / RIGHT TO STEER</div>
      <div class="action-row">
        <button id="jump" class="action-button"><span>↟</span><small>JUMP</small></button>
        <button id="turbo" class="action-button turbo"><span>⚡</span><small>TURBO</small></button>
      </div>
    </div>
    <div id="gameover" class="overlay hidden">
      <span class="eyebrow">MISSION REPORT</span>
      <h2>RIDE COMPLETE</h2>
      <p id="final-score">You travelled 0 metres</p>
      <button id="again" class="primary-button">RIDE AGAIN <span>↻</span></button>
    </div>
    <div id="loading">PREPARING YOUR SHIP…</div>
  </main>
  <script type="module" src="./game.js?v=8"></script>
</body>
</html>
